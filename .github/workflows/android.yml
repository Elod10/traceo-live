name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 absent : impossible de publier une release signée."
            exit 1
          else
            echo "::warning::Secret RELEASE_KEYSTORE_BASE64 absent : seul un APK de debug est produit."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests unitaires et APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Signé, on produit aussi le bundle (.aab) que demande Google Play.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then TASKS="assembleRelease bundleRelease"; else TASKS=assembleDebug; fi
          ./gradlew --no-daemon --stacktrace testDebugUnitTest $TASKS

      - name: Renommer l'APK et le bundle
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk; SUFFIX=""
            AAB="TraceoLive-${VERSION}-${GITHUB_SHA::7}.aab"
            cp app/build/outputs/bundle/release/app-release.aab "$AAB"
            echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk; SUFFIX="-debug"
          fi
          NAME="TraceoLive-${VERSION}-${GITHUB_SHA::7}${SUFFIX}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TraceoLive-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Bundle pour Google Play
        if: steps.apk.outputs.aab != ''
        uses: actions/upload-artifact@v4
        with:
          name: TraceoLive-aab
          path: ${{ steps.apk.outputs.aab }}
          if-no-files-found: error

      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.aab }}
          generate_release_notes: true
